version: '3'

services:
  node:
    container_name: ${PROJECT}_node
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    working_dir: /home/node/app
    logging:
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      HOST: 0.0.0.0
      PORT: 3005
      KATAGO_BIN: ${KATAGO_BIN:-/opt/katago/katago}
      KATAGO_CONFIG: ${KATAGO_CONFIG:-/home/node/app/katago/analysis.cfg}
      KATAGO_MODEL: ${KATAGO_MODEL:-/home/node/app/katago/models/default.bin.gz}
      KATAGO_MODEL_URL: ${KATAGO_MODEL_URL:-https://github.com/lightvector/KataGo/releases/download/v1.4.5/g170e-b20c256x2-s5303129600-d1228401921.bin.gz}
      KATAGO_QUERY_TIMEOUT_MS: ${KATAGO_QUERY_TIMEOUT_MS:-1800000}
    expose:
      - 3005
    volumes:
      - ./:/home/node/app
      - ./docker/node/bootstrap.sh:/usr/local/bin/bootstrap.sh
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${PROJECT}-backend.rule=Host(`${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.${PROJECT}-backend.entrypoints=web"
      - "traefik.http.routers.${PROJECT}-backend.service=${PROJECT}-backend"
      - "traefik.http.services.${PROJECT}-backend.loadbalancer.server.port=3005"
    networks:
      - default
      - web
    entrypoint: ['sh', '/usr/local/bin/bootstrap.sh']
    command: sh -c 'yarn && yarn dev'
    restart: ${RESTART}

  storage:
    container_name: ${PROJECT}_storage
    image: nginx:stable-alpine
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.${PROJECT}-storage.rule=Host(`storage.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.${PROJECT}-storage.entrypoints=web"
      - "traefik.http.routers.${PROJECT}-storage.service=${PROJECT}-storage"
      - "traefik.http.services.${PROJECT}-storage.loadbalancer.server.port=80"
    networks:
      - default
      - web
    volumes:
      - ./storage/kifu:/usr/share/nginx/html/kifu:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: ${RESTART}

  db:
    container_name: ${PROJECT}_db
    image: postgres:12.2-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - 127.0.0.1:${DOCKER_DB_PORT}:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: ${RESTART}

volumes:
  db_data:

networks:
  web:
    external: true
